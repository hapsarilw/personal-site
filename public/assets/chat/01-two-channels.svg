<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16212E"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#F4F4F1"/>

  <text x="60" y="52" font-size="12" letter-spacing="2.2" fill="#5C6B7A">CREW CHAT / TWO INBOUND CHANNELS</text>
  <text x="60" y="90" font-size="30" font-weight="700" fill="#16212E">The client joins one room, not two hundred</text>
  <line x1="60" y1="112" x2="900" y2="112" stroke="#C9CFD6" stroke-width="1"/>

  <!-- sender -->
  <rect x="370" y="142" width="220" height="52" fill="#FFFFFF" stroke="#16212E" stroke-width="1.5"/>
  <text x="480" y="166" font-size="14" font-weight="600" text-anchor="middle" fill="#16212E">Alice sends a message</text>
  <text x="480" y="184" font-size="12.5" text-anchor="middle" fill="#5C6B7A" font-family="Menlo, monospace">room 42</text>
  <path d="M480,194 L480,224" stroke="#16212E" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- hub -->
  <rect x="330" y="228" width="300" height="60" fill="#16212E"/>
  <text x="480" y="252" font-size="14.5" font-weight="600" text-anchor="middle" fill="#FFFFFF">ChatHub</text>
  <text x="480" y="272" font-size="12.5" text-anchor="middle" fill="#9DB2C7" font-family="Menlo, monospace">/hubs/chat</text>

  <!-- split -->
  <path d="M480,288 L480,312 L250,312 L250,336" fill="none" stroke="#16212E" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M480,288 L480,312 L710,312 L710,336" fill="none" stroke="#16212E" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- LEFT branch -->
  <rect x="120" y="340" width="260" height="38" fill="#16212E"/>
  <text x="250" y="364" font-size="13.5" font-weight="600" text-anchor="middle" fill="#FFFFFF" font-family="Menlo, monospace">ReceiveMessage</text>

  <rect x="120" y="392" width="260" height="112" fill="#E3EDF9" stroke="#2E5C8A" stroke-width="1.5"/>
  <text x="140" y="416" font-size="13" font-weight="700" fill="#16212E">Room group</text>
  <text x="140" y="437" font-size="12.5" fill="#2E5C8A" font-family="Menlo, monospace">Clients.Group("room-42")</text>
  <line x1="140" y1="450" x2="360" y2="450" stroke="#A9C4E0"/>
  <text x="140" y="470" font-size="12.5" fill="#16212E">Full message DTO:</text>
  <text x="140" y="488" font-size="12.5" fill="#16212E">body, media, reply, sender</text>

  <path d="M250,504 L250,532" stroke="#16212E" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="120" y="536" width="260" height="52" fill="#FFFFFF" stroke="#16212E" stroke-width="1.5"/>
  <text x="250" y="558" font-size="13" font-weight="600" text-anchor="middle" fill="#16212E">Only the OPEN room</text>
  <text x="250" y="576" font-size="12.5" text-anchor="middle" fill="#5C6B7A">renders the thread</text>

  <!-- RIGHT branch -->
  <rect x="580" y="340" width="260" height="38" fill="#16212E"/>
  <text x="710" y="364" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF" font-family="Menlo, monospace">ReceiveMessagePreview</text>

  <rect x="580" y="392" width="260" height="112" fill="#E3EDF9" stroke="#2E5C8A" stroke-width="1.5"/>
  <text x="600" y="416" font-size="13" font-weight="700" fill="#16212E">Personal group</text>
  <text x="600" y="437" font-size="12.5" fill="#2E5C8A" font-family="Menlo, monospace">Clients.Group("user-{id}")</text>
  <line x1="600" y1="450" x2="820" y2="450" stroke="#A9C4E0"/>
  <text x="600" y="470" font-size="12.5" fill="#16212E">Light payload:</text>
  <text x="600" y="488" font-size="12.5" fill="#16212E">roomId, preview, unread hint</text>

  <path d="M710,504 L710,532" stroke="#16212E" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="580" y="536" width="260" height="52" fill="#FFFFFF" stroke="#16212E" stroke-width="1.5"/>
  <text x="710" y="558" font-size="13" font-weight="600" text-anchor="middle" fill="#16212E">Every other room</text>
  <text x="710" y="576" font-size="12.5" text-anchor="middle" fill="#5C6B7A">updates its list row only</text>

  <!-- centre note -->
  <rect x="400" y="392" width="160" height="112" fill="none"/>
  <text x="480" y="432" font-size="12" text-anchor="middle" fill="#5C6B7A">2 groups</text>
  <text x="480" y="450" font-size="12" text-anchor="middle" fill="#5C6B7A">per connection</text>
  <text x="480" y="474" font-size="12" text-anchor="middle" fill="#5C6B7A">not one</text>
  <text x="480" y="492" font-size="12" text-anchor="middle" fill="#5C6B7A">per room</text>

  <text x="60" y="620" font-size="13" fill="#16212E">A user with 500 conversations costs the same as a user with 5. The trade: no list-wide typing indicator, because typing goes to the room group only.</text>
</svg>
